<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Whiteboard — GoodNotes Canvas Mockup</title>
<meta name="description" content="Pixelnaher Nachbau der GoodNotes-Whiteboard-Oberfläche: Tab-Leiste, Werkzeugleiste, schwebendes Werkzeugmenü und funktionierende Zeichenfläche.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2300A99D'/><path d='M9 22c3-9 5-12 7-12s2 3 0 7-3 5-1 5 4-2 6-5' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app" class="app" data-mode="edit" data-tool="pen">

  <!-- Statusleisten-Spacer (rein optisch, wie auf dem iPad) -->
  <div class="statusbar" aria-hidden="true">
    <span class="statusbar__time" id="statusTime">9:41</span>
    <span class="statusbar__right">
      <span class="statusbar__wifi"></span>
      <span class="statusbar__battery"></span>
    </span>
  </div>

  <!-- ═══════════════ Zeile A — Dokument-Tabs ═══════════════ -->
  <header class="tabsbar">
    <button class="iconbtn iconbtn--lg" data-action="library" aria-label="Bibliothek" title="Bibliothek">
      <span class="icon icon--22" data-icon="library"></span>
    </button>
    <span class="hairline-v" aria-hidden="true"></span>
    <div class="tabstrip" id="tabStrip" role="tablist" aria-label="Geöffnete Boards"></div>
    <button class="iconbtn iconbtn--xs" data-action="newTab" aria-label="Neuer Tab" title="Neues Board in neuem Tab">
      <span class="icon icon--18" data-icon="plus"></span>
    </button>
  </header>

  <!-- ═══════════════ Zeile B — Navigationsleiste ═══════════════ -->
  <nav class="navbar glass-chrome">
    <div class="navbar__section navbar__section--left">
      <button class="iconbtn" data-action="sidebar" aria-label="Seitenleiste" title="Boards-Übersicht (⌘\)" aria-pressed="false">
        <span class="icon" data-icon="sidebar"></span>
      </button>
      <button class="iconbtn" data-action="search" aria-label="Suchen" title="Suchen (⌘F)">
        <span class="icon" data-icon="search"></span>
      </button>
      <button class="iconbtn iconbtn--accent" data-action="ai" aria-label="Goodnotes AI" title="Goodnotes AI">
        <span class="icon" data-icon="aiSparkle"></span>
      </button>
      <button class="iconbtn" data-action="mode" aria-label="Ansichtsmodus" title="Lesemodus (⌘⇧R)">
        <span class="icon" data-icon="viewEdit"></span>
      </button>
      <span class="hairline-v" aria-hidden="true"></span>
    </div>

    <div class="navbar__section navbar__section--mid" id="toolbar" role="toolbar" aria-label="Werkzeuge">
      <div class="toolbar__history">
        <button class="iconbtn" data-action="undo" aria-label="Rückgängig" title="Rückgängig (⌘Z)" disabled>
          <span class="icon" data-icon="undo"></span>
        </button>
        <button class="iconbtn" data-action="redo" aria-label="Wiederholen" title="Wiederholen (⌘⇧Z)" disabled>
          <span class="icon" data-icon="redo"></span>
        </button>
      </div>
      <span class="hairline-v" aria-hidden="true"></span>
      <div class="toolbar__tools" id="toolList"></div>
      <span class="hairline-v" aria-hidden="true"></span>
      <button class="iconbtn" data-action="accessories" aria-label="Zubehör" title="Zubehör">
        <span class="icon" data-icon="accessories"></span>
      </button>
    </div>

    <div class="navbar__section navbar__section--right">
      <span class="hairline-v" aria-hidden="true"></span>
      <button class="iconbtn" data-action="addBoard" aria-label="Board hinzufügen" title="Board hinzufügen">
        <span class="icon" data-icon="plus"></span>
      </button>
      <button class="iconbtn" data-action="share" aria-label="Teilen und exportieren" title="Teilen und exportieren">
        <span class="icon" data-icon="share"></span>
      </button>
      <button class="iconbtn" data-action="more" aria-label="Weitere Optionen" title="Weitere Optionen">
        <span class="icon" data-icon="more"></span>
      </button>
    </div>
  </nav>

  <!-- ═══════════════ Bühne ═══════════════ -->
  <main class="stage">
    <aside class="sidebar" id="sidebar" aria-label="Boards" hidden>
      <div class="sidebar__head">
        <span class="sidebar__title" id="sidebarTitle">Boards</span>
        <button class="iconbtn iconbtn--xs" data-action="sidebar" aria-label="Seitenleiste schließen">
          <span class="icon icon--18" data-icon="close"></span>
        </button>
      </div>
      <div class="sidebar__body" id="sidebarBody"></div>
    </aside>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas" class="canvas"></canvas>
      <div class="overlay" id="overlay"></div>

      <!-- Zeile C — schwebendes Werkzeugmenü -->
      <div class="toolmenu glass-capsule" id="toolMenu" data-dock="top" role="toolbar" aria-label="Werkzeugoptionen">
        <button class="toolmenu__grip" id="toolMenuGrip" aria-label="Werkzeugmenü verschieben" title="Ziehen zum Andocken">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </button>
        <div class="toolmenu__body" id="toolMenuBody"></div>
      </div>

      <!-- Minimap unten links -->
      <div class="minimap glass-capsule" id="minimap" title="Übersichtskarte — ziehen zum Verschieben, Doppelklick passt ein">
        <canvas id="minimapCanvas"></canvas>
        <span class="minimap__empty" id="minimapEmpty">Leer</span>
      </div>

      <!-- Zoom unten rechts -->
      <div class="bottomright">
        <button class="minimap-toggle glass-capsule is-on" data-action="minimap" aria-label="Übersichtskarte" title="Übersichtskarte ein-/ausblenden">
          <span class="icon icon--20" data-icon="minimap"></span>
        </button>
        <div class="zoomctl glass-capsule">
          <button class="zoomctl__btn" data-action="zoomOut" aria-label="Verkleinern" title="Verkleinern">
            <span class="icon icon--18" data-icon="minus"></span>
          </button>
          <button class="zoomctl__value" data-action="zoomMenu" title="Zoomstufen"><span id="zoomLabel">100 %</span></button>
          <button class="zoomctl__btn" data-action="zoomIn" aria-label="Vergrößern" title="Vergrößern">
            <span class="icon icon--18" data-icon="plus"></span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <div class="popover-layer" id="popoverLayer" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script src="js/icons.js"></script>
<script src="js/geometry.js"></script>
<script src="js/shapes.js"></script>
<script src="js/model.js"></script>
<script src="js/renderer.js"></script>
<script src="js/popovers.js"></script>
<script src="js/tools.js"></script>
<script src="js/toolmenu.js"></script>
<script src="js/chrome.js"></script>
<script src="js/app.js"></script>
</body>
</html>
